name: Feature request
description: Suggest something Citadel doesn't do yet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What real need or scenario is this for?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you want Citadel to do instead?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Related modules, hardware you have, links to similar tools, etc.

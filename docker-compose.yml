# Module system, ROADMAP.md Phase B. This file now holds only Citadel's
# core, always-on infrastructure (cockpit + vault-api) plus the top-level
# `include:` list that pulls in every optional module's own compose
# fragment from modules/<name>/compose.fragment.yml -- one self-contained
# folder per module (manifest.json + compose.fragment.yml +
# nginx.fragment.conf), instead of one giant file every module used to be
# hand-edited into directly. `include:` is a real Compose Specification
# feature (Compose v2.20+, well below this project's baseline) that merges
# every included file's services/networks into one model, exactly as if
# they'd all been written in this one file -- profiles still control which
# included services actually START (COMPOSE_PROFILES in .env, unchanged
# from before this split), `include:` only controls which services Compose
# even knows about.
#
# IMPORTANT if you add a new module: relative host paths inside a fragment
# file resolve relative to THAT FILE's own directory (modules/<name>/), not
# this file's -- confirmed empirically, not assumed, since Compose's docs
# on this are easy to misread. modules/<name>/ is TWO levels under this
# file's own directory (citadel/modules/<name>/), so every fragment's
# volume paths start with `../../appdata/...`, not `./appdata/...` like
# this file's own `vault-api`/`cockpit` volumes below, and not a single
# `../` either -- that was a real live bug this session, caught by
# actually reading `docker compose config`'s resolved output rather than
# assuming the first fix was right.
# --- MODULE INCLUDES: START (auto-generated, do not hand-edit) ---
include:
  - modules/ai/compose.fragment.yml
  - modules/audio/compose.fragment.yml
  - modules/camera/compose.fragment.yml
  - modules/education/compose.fragment.yml
  - modules/hardware/compose.fragment.yml
  - modules/knowledge/compose.fragment.yml
  - modules/notes/compose.fragment.yml
  - modules/recipes/compose.fragment.yml
  - modules/vigil/compose.fragment.yml
# --- MODULE INCLUDES: END ---

services:
  # Layer 1: Your Custom Tactical Dashboard Layout Router
  cockpit:
    image: nginx:alpine
    container_name: citadel-cockpit
    environment:
      # Passed straight through from .env's own COMPOSE_PROFILES -- the
      # exact same value that decided which containers actually started
      # (see this file's own top-of-file comment and .env), so the
      # manifest below can never drift from what's really running. Only
      # reflects profile selection made via .env -- if profiles are ever
      # chosen with a raw `--profile` CLI flag instead of .env's
      # COMPOSE_PROFILES, this won't see it (Compose's own ${VAR}
      # substitution here only reads .env/shell env, not CLI flags).
      - COMPOSE_PROFILES=${COMPOSE_PROFILES}
      # Real per-install station info (call sign, town, grid locator, home
      # coordinates) used only by map.html's marker -- decided 2026-09-12
      # after finding these had been hardcoded directly into map.html and
      # already pushed to this repo's real GitHub remote. Real values live
      # in .env (gitignored, never committed); the committed map.html now
      # only ever sees generic placeholders unless a real .env sets these.
      - STATION_CALLSIGN=${STATION_CALLSIGN:-N0CALL}
      - STATION_LOCATION=${STATION_LOCATION:-Unconfigured}
      - STATION_GRID=${STATION_GRID:-AA00aa}
      - STATION_LAT=${STATION_LAT:-0}
      - STATION_LON=${STATION_LON:-0}
      # Real fix for a live-reported vulnerability (2026-09-21, a real
      # tester's own audit): vault-api's /api/* had zero authentication,
      # and its docker.sock mount + module-install endpoint together mean
      # an unauthenticated request can get root-equivalent control of the
      # host. Generated once at install time (install.sh/install.bat),
      # written here into a real static file (vault-token.json) the same
      # way station-config.json already is, so cockpit's own pages can
      # read it and attach it to their own /api/ calls -- see
      # vault-auth.js. Baking it into a page anyone on the LAN can already
      # load (the tester's own stated threat model explicitly accepts LAN
      # access) is the correct scope: this blocks a *different* page that
      # never loaded the dashboard from blindly POSTing to the API, which
      # is the real CSRF-shaped attack the report named.
      - VAULT_API_TOKEN=${VAULT_API_TOKEN:-}
    command: >
      sh -c "
      json='[';
      first=1;
      for p in $$(echo \"$$COMPOSE_PROFILES\" | tr ',' ' '); do
        if [ \"$$first\" = '1' ]; then first=0; else json=\"$$json,\"; fi;
        json=\"$$json\\\"$$p\\\"\";
      done;
      json=\"$$json]\";
      echo \"$$json\" > /usr/share/nginx/html/modules-enabled.json;
      printf '{\"callsign\":\"%s\",\"location\":\"%s\",\"grid\":\"%s\",\"lat\":%s,\"lon\":%s}' \"$$STATION_CALLSIGN\" \"$$STATION_LOCATION\" \"$$STATION_GRID\" \"$$STATION_LAT\" \"$$STATION_LON\" > /usr/share/nginx/html/station-config.json;
      printf '{\"token\":\"%s\"}' \"$$VAULT_API_TOKEN\" > /usr/share/nginx/html/vault-token.json;
      mkdir -p /etc/nginx/modules-enabled;
      rm -f /etc/nginx/modules-enabled/*.conf;
      for p in $$(echo \"$$COMPOSE_PROFILES\" | tr ',' ' '); do
        if [ -f \"/citadel-modules/$$p/nginx.fragment.conf\" ]; then
          cp \"/citadel-modules/$$p/nginx.fragment.conf\" \"/etc/nginx/modules-enabled/$$p.conf\";
        fi;
      done;
      exec nginx -g 'daemon off;'
      "
    ports:
      - 8085:80
    volumes:
      - ./appdata/cockpit:/usr/share/nginx/html
      - ./appdata/cockpit/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./appdata/project-vigil:/usr/share/nginx/html/project-vigil
      # Read-only: this container only ever reads each module's
      # nginx.fragment.conf (see the startup script above) to assemble
      # /etc/nginx/modules-enabled/ -- it never writes back into modules/.
      - ./modules:/citadel-modules:ro
    # Real memory cap, added 2026-09-14 after a live freeze this session
    # traced to unbounded container memory use (see ROADMAP.md). Original
    # 128m was measured under 20MB in real use -- that measurement never
    # exercised the Tactical Map's /tiles/ route. Raised to 1024m on
    # 2026-09-16 after a real live crash loop: `docker inspect` showed
    # OOMKilled=true / restarts=2, and the kernel log had 20+ separate
    # `Memory cgroup out of memory: Killed process ... (nginx)` entries in
    # under an hour, traced directly to nginx's own access log showing
    # single 100-630MB responses off comms_base.pmtiles (1.9GB on disk) --
    # oversized Range requests, not a leak. Cgroup v2 counts page-cache
    # pages from sendfile()'d reads against the serving container's own
    # memory.current, so serving big spans of a large file genuinely
    # spikes this container's accounted memory even with zero app-level
    # buffering -- 128m was never going to survive that once the Tactical
    # Map saw real use. Verified enforced by plain `docker compose up -d`
    # on this project's Compose version (2.40.3) -- no Swarm/`deploy:`
    # needed, confirmed via `docker inspect`.
    mem_limit: 1024m
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 1.5: Your Native Python Vault Brain
  vault-api:
    # Real Dockerfile as of 2026-09-14 (see its own comment) -- used to
    # `pip install`/`apk add` at every restart, which needed live
    # internet access just to come back up. Now a real built image with
    # pinned deps; app.py still volume-mounted below, unchanged.
    build: ./appdata/media-vault
    container_name: citadel-vault-brain
    command: sh -c "FLASK_APP=/app/app.py flask run --host=0.0.0.0 --port=5000"
    volumes:
      - ./appdata/media-vault:/app
      # Module system (Settings > Modules), added 2026-09-14 -- listing
      # installed modules and installing a new one from an uploaded .zip
      # (modules_manager.py) only need to read/write modules/ and rewrite
      # docker-compose.yml's include: list, the SAME kind of privilege
      # vault-api already has everywhere else in this file (read/write
      # its own files). Deliberately separate from the docker.sock +
      # host-path-mirror mounts below, which are ONLY needed for actually
      # starting/stopping containers -- so listing and installing modules
      # still works even for someone who hasn't (or won't) opt into that
      # bigger privilege step.
      - ./modules:/citadel-modules-rw
      - ./docker-compose.yml:/citadel-compose-file
      # Module system "one-click apply" (Settings > Modules), added
      # 2026-09-14 -- lets vault-api actually run a real `docker compose
      # up -d` when you toggle a module, instead of just editing .env and
      # telling you to run it yourself. This is Docker-outside-of-Docker
      # (DooD): mounting the HOST's own docker.sock lets a command run
      # INSIDE this container control containers on the host, as if it
      # were the host's own docker CLI. Real, meaningful privilege step
      # up from everything else this container does (which only reads/
      # writes files) -- a container that can reach this socket can
      # start, stop, or otherwise control ANY container on the host, not
      # just Citadel's own. Deliberate tradeoff, not an oversight: see
      # ROADMAP.md's module-management entry for the alternative
      # (manual `docker compose up -d`, no new privilege at all) that was
      # considered and explicitly not chosen.
      - /var/run/docker.sock:/var/run/docker.sock
      # The SECOND, easy-to-miss half of DooD: the `docker compose`
      # binary running inside THIS container still talks to the HOST's
      # dockerd over that socket, so when it resolves docker-compose.yml's
      # relative volume paths (./appdata/cockpit etc.), those paths need
      # to already BE valid on the HOST, at the exact same absolute path
      # this container sees them at -- otherwise it would send the host
      # dockerd bind-mount requests for paths that only exist inside THIS
      # container, which the host doesn't have. Mounting the whole project
      # directory at an IDENTICAL path on both sides is what makes that
      # line up. CITADEL_HOST_PATH is written into .env by install.sh at
      # install time (the real absolute path Citadel was installed to on
      # THIS machine) -- apply_compose() in modules_manager.py refuses to
      # run at all if it's not set, rather than mount some placeholder
      # path and fail confusingly later.
      - ${CITADEL_HOST_PATH:-/citadel-host-path-unset}:${CITADEL_HOST_PATH:-/citadel-host-path-unset}
      - ./appdata/media-vault/videos:/app/videos
      - ./appdata/media-vault/mp3s:/app/mp3s
      - ./appdata/media-vault/pdfs:/app/pdfs
      - ./appdata/media-vault/notes-data:/app/notes-data
      # Real backup/restore (/api/backup/*), added 2026-09-13 -- vault-api
      # needs to see the OTHER services' real data (it only had its own
      # ./appdata/media-vault before) to actually back up more than
      # itself. Read-write on purpose: restore has to be able to write
      # into these too. Backups are stored at ./backups (repo root, NOT
      # under ./appdata) specifically so a backup archive never ends up
      # recursively containing earlier backups of itself.
      #
      # CRITICAL: these three mount at container ROOT paths, deliberately
      # NOT nested under /app. /app is ITSELF a bind mount of
      # ./appdata/media-vault -- a live bug this session mounted new
      # paths under /app/... instead, which meant (a) Docker created
      # mount-point placeholder files/dirs for the nested mounts by
      # writing them onto /app's own backing host directory, littering
      # ./appdata/media-vault with junk, and (b) far worse, restoring
      # walked into what LOOKED like a separate "/app/citadel-appdata/
      # media-vault" path but was actually the exact same host directory
      # as /app itself -- rmtree-ing the running Flask process's own
      # working directory mid-request, which really deleted backup.py
      # and test_transcription.py before failing with "Resource busy".
      # Root-level paths here can never nest inside another mount this
      # container has. backup.py's own EXCLUDE_DIRS additionally excludes
      # "media-vault" from ever being walked via citadel-appdata at all,
      # as defense in depth -- see that file's module docstring.
      - ./appdata:/citadel-appdata
      - ./.env:/citadel-appdata-env
      - ./backups:/citadel-backups
    environment:
      # Lets /api/pantry-check (app.py) call the mealie container below
      # server-to-server -- see that route's own comment for why this
      # bridge lives in vault-api instead of a browser calling Mealie
      # directly.
      - MEALIE_BASE_URL=http://citadel-mealie:9000
      - MEALIE_API_TOKEN=${MEALIE_API_TOKEN}
      - CITADEL_HOST_PATH=${CITADEL_HOST_PATH:-}
      # Real fix for a live-reported vulnerability (2026-09-21) -- see
      # cockpit's own comment on this same variable above for the full
      # story. Required on every real request from here on (app.py's
      # before_request hook) -- generated once by install.sh/install.bat,
      # never guessed or defaulted to something predictable.
      - VAULT_API_TOKEN=${VAULT_API_TOKEN:-}
      # News Archive & Local Log's real location-based alert scoping
      # (news_location.py/news_matcher.py) -- the same STATION_LAT/
      # STATION_LON cockpit already uses for the Tactical Map marker,
      # not a second location entry. Blank is a real, handled state
      # (news_location.py resolves no zone codes, news_matcher.py shows
      # everything unfiltered), not an error.
      - STATION_LAT=${STATION_LAT:-}
      - STATION_LON=${STATION_LON:-}
    # Real memory cap, added 2026-09-14 -- see cockpit's own comment
    # above for why. Measured under 30MB in real use (Flask + the
    # docker CLI it shells out to for one-click module apply); 256m
    # covers that plus a real docker-compose reconcile running inside it.
    mem_limit: 256m
    networks:
      - citadel-net
    restart: unless-stopped
    depends_on:
      mealie:
        condition: service_started
        # vault-api is always-on core infra, but mealie (now defined in
        # modules/recipes/compose.fragment.yml) is gated behind the
        # "recipes" profile -- `required: false` means "wait for it if
        # the recipes profile is active, but don't force mealie to start
        # (or error out) when it's excluded from a lighter install."
        # `include:` merges mealie's service definition into this same
        # model regardless of profile selection (profiles only gate what
        # STARTS, not what Compose knows about), so this cross-file
        # reference resolves exactly like it did before the module split
        # -- verified with `docker compose config` after the split.
        required: false

networks:
  citadel-net:
    driver: bridge

# Module profiles, added 2026-09-12 (ROADMAP.md Phase B) -- each optional
# service below is tagged with a `profiles:` entry matching its cockpit
# card, so `docker compose --profile <name> up -d` can bring up just one
# module (the actual mechanism a Pi-friendly "install only what you want"
# system needs). `cockpit` and `vault-api` carry NO profile -- they're
# shared core infrastructure (the dashboard router and the backend many
# modules' API routes live on), not a single toggleable module.
#
# Critical: a bare `docker compose up -d` with NO --profile flag only
# starts services that have no `profiles:` tag at all -- everything
# tagged below would silently stop starting on a fresh boot, which would
# be a real regression on a system already relied on daily. `.env`'s
# COMPOSE_PROFILES variable is read automatically by the `docker compose`
# CLI itself (a real Compose feature, not something wired up manually
# here) and defaults to every module profile -- so today's exact
# behavior (`docker compose up -d` starts everything except the
# `hardware`-gated scanner) is unchanged unless COMPOSE_PROFILES is
# deliberately overridden to a smaller list, e.g. for a lightweight Pi
# install running only the vigil/notes/knowledge modules.
services:
  # Layer 1: Your Custom Tactical Dashboard Layout Router
  cockpit:
    image: nginx:alpine
    container_name: citadel-cockpit
    environment:
      # Passed straight through from .env's own COMPOSE_PROFILES -- the
      # exact same value that decided which containers actually started
      # (see this file's own top-of-file comment and .env), so the
      # manifest below can never drift from what's really running. Only
      # reflects profile selection made via .env -- if profiles are ever
      # chosen with a raw `--profile` CLI flag instead of .env's
      # COMPOSE_PROFILES, this won't see it (Compose's own ${VAR}
      # substitution here only reads .env/shell env, not CLI flags).
      - COMPOSE_PROFILES=${COMPOSE_PROFILES}
      # Real per-install station info (call sign, town, grid locator, home
      # coordinates) used only by map.html's marker -- decided 2026-09-12
      # after finding these had been hardcoded directly into map.html and
      # already pushed to this repo's real GitHub remote. Real values live
      # in .env (gitignored, never committed); the committed map.html now
      # only ever sees generic placeholders unless a real .env sets these.
      - STATION_CALLSIGN=${STATION_CALLSIGN:-N0CALL}
      - STATION_LOCATION=${STATION_LOCATION:-Unconfigured}
      - STATION_GRID=${STATION_GRID:-AA00aa}
      - STATION_LAT=${STATION_LAT:-0}
      - STATION_LON=${STATION_LON:-0}
    command: >
      sh -c "
      json='[';
      first=1;
      for p in $$(echo \"$$COMPOSE_PROFILES\" | tr ',' ' '); do
        if [ \"$$first\" = '1' ]; then first=0; else json=\"$$json,\"; fi;
        json=\"$$json\\\"$$p\\\"\";
      done;
      json=\"$$json]\";
      echo \"$$json\" > /usr/share/nginx/html/modules-enabled.json;
      printf '{\"callsign\":\"%s\",\"location\":\"%s\",\"grid\":\"%s\",\"lat\":%s,\"lon\":%s}' \"$$STATION_CALLSIGN\" \"$$STATION_LOCATION\" \"$$STATION_GRID\" \"$$STATION_LAT\" \"$$STATION_LON\" > /usr/share/nginx/html/station-config.json;
      exec nginx -g 'daemon off;'
      "
    ports:
      - 8085:80
    volumes:
      - ./appdata/cockpit:/usr/share/nginx/html
      - ./appdata/cockpit/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./appdata/project-vigil:/usr/share/nginx/html/project-vigil

    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 1.2: Project VIGIL Unified Smart Home Controller Kernel.
  # Replaces what used to be two separate containers here (vigil-hub
  # running vigil_core.py, vigil-power running vigil_hub.py -- yes, those
  # names really were swapped like that) with one, decided 2026-09-13
  # (ROADMAP.md Phase D): vigil_kernel.py now carries the device
  # registry, relay control, solar/security telemetry, real automation
  # logic (load-shedding, tripline-triggered lighting), a real hardware-
  # adapter registry (Tasmota/Shelly Gen1+Gen2/ESPHome/Zigbee2MQTT, each
  # against that project's own documented API -- see vigil_kernel.py's
  # own comments for exact doc links and the honest caveat that none of
  # them have real hardware to verify against yet), and real mDNS local
  # network discovery. zeroconf (mDNS) and paho-mqtt (Zigbee2MQTT) are
  # real new dependencies this needs, installed the same runtime-pip
  # pattern as every other lightweight Python service in this file.
  vigil:
    image: python:3.10-alpine
    container_name: citadel-vigil
    profiles: ["vigil"]
    volumes:
      - ./appdata/project-vigil:/app
    working_dir: /app
    ports:
      - "8082:8085"
    command: sh -c "pip install zeroconf paho-mqtt && python /app/vigil_kernel.py"
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 1.5: Your Native Python Vault Brain
  vault-api:
    image: python:3.10-alpine
    container_name: citadel-vault-brain
    command: >
      sh -c "pip install flask requests && FLASK_APP=/app/app.py flask run --host=0.0.0.0 --port=5000"
    volumes:
      - ./appdata/media-vault:/app
      - ./appdata/media-vault/videos:/app/videos
      - ./appdata/media-vault/mp3s:/app/mp3s
      - ./appdata/media-vault/pdfs:/app/pdfs
      - ./appdata/media-vault/notes-data:/app/notes-data
    environment:
      # Lets /api/pantry-check (app.py) call the mealie container below
      # server-to-server -- see that route's own comment for why this
      # bridge lives in vault-api instead of a browser calling Mealie
      # directly.
      - MEALIE_BASE_URL=http://citadel-mealie:9000
      - MEALIE_API_TOKEN=${MEALIE_API_TOKEN}
    networks:
      - citadel-net
    restart: unless-stopped
    depends_on:
      mealie:
        condition: service_started
        # vault-api is always-on core infra, but mealie is gated behind
        # the "recipes" profile -- `required: false` means "wait for it
        # if the recipes profile is active, but don't force mealie to
        # start (or error out) when it's excluded from a lighter
        # install." Without this, a Pi install that skips `recipes`
        # would either fail to start vault-api or be forced to also run
        # mealie regardless of profile selection -- verified against
        # real `docker compose config` output for both an all-profiles
        # and a recipes-excluded profile list before relying on this.
        required: false

  # Layer 2: The Core Offline AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: citadel-ollama
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ./appdata/ollama:/root/.ollama
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 3: The Multi-User AI Web Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: citadel-webui
    profiles: ["ai"]
    ports:
      - 8090:8080
    volumes:
      - ./appdata/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://citadel-ollama:11434
    networks:
      - citadel-net
    depends_on:
      - ollama
    restart: unless-stopped

  # Layer 4: The Offline Knowledge Matrix
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: citadel-kiwix
    profiles: ["knowledge"]
    ports:
      - 8095:8080
    volumes:
      - ${KIWIX_STORAGE_PATH}:/data
    command: --library library.xml
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 5: The Portable Flat Notes Logging Engine
  flatnotes:
    image: dullage/flatnotes:latest
    container_name: citadel-flatnotes
    profiles: ["notes"]
    ports:
      - 8098:8080
    environment:
      - FLATNOTES_AUTH_TYPE=none
    volumes:
      - ./appdata/flatnotes:/data
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 6: Trunked-radio scanner decode (P25/op25), decided 2026-09-05.
  # Real, mature open-source decoder (robotastic/trunk-recorder) -- not a
  # stub image. Under the "hardware" profile (not listed in
  # COMPOSE_PROFILES' default set in .env, unlike every module profile
  # above -- this one genuinely must stay opt-in), so a normal `docker
  # compose up` never tries to start this: it needs an actual RTL-SDR (or similar)
  # dongle passed through via `devices:` below, plus a real config.json +
  # talkgroups.csv for your own county's trunked system (get these from
  # your own SDR setup or radioreference.com -- never invented/generic
  # values, since a wrong control-channel frequency just fails silently).
  # Start it explicitly once both exist: `docker compose --profile
  # hardware up -d scanner`. Writes call audio into the same
  # appdata/media-vault/scanner/ directory vault-api's /api/scanner reads
  # from -- the bridge that turns trunk-recorder's own statusServer API
  # into scanner_state.json is real remaining work, intentionally not
  # written speculatively with no running daemon to test it against (see
  # ROADMAP.md).
  scanner:
    image: robotastic/trunk-recorder:latest
    container_name: citadel-scanner
    profiles: ["hardware"]
    devices:
      - /dev/bus/usb
    volumes:
      - ./appdata/media-vault/scanner:/app
    working_dir: /app
    command: trunk-recorder --config=/app/config.json
    networks:
      - citadel-net
    restart: unless-stopped

  # The bridge that turns trunk-recorder's real statusServer websocket
  # messages into scanner_state.json, decided 2026-09-06 (scanner_bridge.py
  # -- see that file's own module docstring for the real message-shape
  # verification and connection-direction correction that went into it).
  # trunk-recorder is the websocket *client* here, dialing out to this
  # service per its own config.json's "statusServer" field
  # (scanner_config.py's STATUS_SERVER_URL) -- this service just has to be
  # listening. Same "hardware" profile as `scanner` above: no point
  # running a status bridge for a decoder that isn't running either.
  # Pure software otherwise -- no USB device needed by this container
  # itself, only by `scanner`.
  scanner-bridge:
    image: python:3.10-alpine
    container_name: citadel-scanner-bridge
    profiles: ["hardware"]
    command: sh -c "pip install websockets && python3 scanner_bridge.py"
    environment:
      - SCANNER_BRIDGE_HOST=0.0.0.0
      - SCANNER_BRIDGE_PORT=3010
      - SCANNER_STATE_PATH=/app/scanner-out/scanner_state.json
    volumes:
      - ./appdata/media-vault/scanner_bridge.py:/app/scanner_bridge.py
      - ./appdata/media-vault/scanner:/app/scanner-out
    working_dir: /app
    networks:
      - citadel-net
    restart: unless-stopped

  # Offline audio transcription via a real whisper.cpp, decided
  # 2026-09-07 -- the "offline audio transcription" Local AI backlog
  # item, meant to eventually transcribe scanner call recordings (see
  # transcription.py). Unlike `scanner`/`scanner-bridge` above, this
  # needs no hardware profile and no USB passthrough at all -- it's pure
  # CPU inference on whatever audio file it's handed, so it runs in the
  # default profile alongside Ollama/Kiwix. `ubuntu:26.04` specifically
  # (not a smaller/older base) because the real `whisper.cpp` apt
  # package (1.8.3+dfsg-2) only exists in that release's `universe`
  # repo -- confirmed live by testing `ubuntu:24.04` first and finding
  # apt-cache genuinely empty for it there, not guessed. The
  # ggml-base.en.bin model (real, downloaded from ggerganov/whisper.cpp's
  # own Hugging Face mirror, ~141MB) is fetched once into a persisted
  # volume rather than re-downloaded on every container restart. Chose
  # base.en over the larger small.en: verified live on this exact CPU
  # (Citadel's real i7-4770, 4c/8t, no GPU) that a real 53-second sample
  # clip transcribes in ~5s -- about 10x realtime, comfortably brief
  # even sharing cores with an Ollama request, which small.en would not
  # have been as reliably.
  whisper:
    image: ubuntu:26.04
    container_name: citadel-whisper
    profiles: ["audio"]
    command: >
      sh -c "apt-get update && apt-get install -y whisper.cpp curl ca-certificates &&
             mkdir -p /models &&
             [ -f /models/ggml-base.en.bin ] || curl -L -o /models/ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin &&
             whisper-server -m /models/ggml-base.en.bin --host 0.0.0.0 --port 8082"
    volumes:
      - ./appdata/whisper-models:/models
    ports:
      - 8096:8082
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 9.5: Cloud9 -- a real, already-built homeschool/kid dashboard
  # (github.com/frankprobst5-stack/Cloud9), previously a Windows-only
  # desktop app for one specific kid's laptop, now run here so it's
  # reachable from any device on the LAN like everything else in Citadel.
  # Needs a real Dockerfile (not the runtime-pip-install pattern the
  # lightweight Python services above use) because llama-cpp-python
  # compiles native code -- see appdata/cloud9/Dockerfile's own comment.
  # data/ and models/ are volume-mounted real host data (the 1.1GB Qwen
  # GGUF model, kid-generated journal/planner/scratchpad content) --
  # never baked into the image, same reasoning as every other appdata/
  # real-data volume in this file.
  cloud9:
    build: ./appdata/cloud9
    container_name: citadel-cloud9
    profiles: ["education"]
    ports:
      - "${CLOUD9_PORT}:5057"
    volumes:
      - ./appdata/cloud9/data:/app/data
      - ./appdata/cloud9/models:/app/models
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 11: Mealie -- a real, mature self-hosted recipe manager and
  # meal planner (github.com/mealie-recipes/mealie), not a bespoke clone.
  # Decided 2026-09-12 after comparing it against Tandoor Recipes: both
  # cover the full recipe/meal-plan/shopping-list wishlist, but Mealie
  # runs on SQLite with no separate Postgres container (Tandoor requires
  # one in every documented compose setup), matching the one-container-
  # per-service shape every other appdata/ entry in this file already
  # follows. Pinned to v3.25.1 (current release at decision time) rather
  # than :latest, consistent with Mealie's own docs example, so an
  # upstream release doesn't silently change this homestead's recipe
  # data model out from under it. ALLOW_SIGNUP is false since this is a
  # single-household LAN tool -- the first admin account is created
  # through Mealie's own first-run setup screen, same as visiting it
  # fresh would require regardless. The pantry-check bridge in vault-api
  # (/api/pantry-check) is the one genuinely custom piece: it calls this
  # container's API over citadel-net using MEALIE_API_TOKEN (set in
  # .env, generated from Mealie's own User Settings > API Tokens page
  # after first login) to cross-check a recipe's ingredients against the
  # Food Inventory / Freezer Foods ledgers vault-api already tracks --
  # data no recipe app could know about on its own.
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.25.1
    container_name: citadel-mealie
    profiles: ["recipes"]
    ports:
      - "${MEALIE_PORT}:9000"
    volumes:
      - ./appdata/mealie/data:/app/data
    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 10: The Offline Home Schooling Matrix Hub
  kolibri:
    image: learningequality/kolibri:latest
    container_name: citadel-kolibri
    profiles: ["education"]
    ports:
      - "${KOLIBRI_PORT}:8080"
    volumes:
      - ${KOLIBRI_DATA_PATH}:/kolibri
    networks:
      - citadel-net
    restart: unless-stopped

networks:
  citadel-net:
    driver: bridge


services:
  # Layer 4: The Offline Knowledge Matrix
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: citadel-kiwix
    profiles: ["knowledge"]
    ports:
      - 8095:8080
    volumes:
      - ${KIWIX_STORAGE_PATH}:/data
    command: --library library.xml
    # Real memory cap, added 2026-09-14 (see docker-compose.yml's
    # cockpit comment for the full "why"). kiwix-serve mmaps .zim
    # archives rather than loading them fully into RAM, so this doesn't
    # scale with your library size the way a normal cache would; 512m
    # covers real serving overhead for typical concurrent LAN use.
    mem_limit: 512m
    networks:
      - citadel-net
    restart: unless-stopped

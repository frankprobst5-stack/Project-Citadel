# Project Vigil Smart Home Automation UI Proxy Lanes
location /api/grid { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/grid; }
location /api/register { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/register; }
location /api/toggle { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/toggle; }
# Solar/security telemetry and mDNS device discovery -- new routes,
# 2026-09-13 (ROADMAP.md Phase D unification), same container as the
# three routes above now that vigil-hub/vigil-power merged into one
# citadel-vigil service.
location /api/vigil/state { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/state; }
location /api/vigil/update { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/update; }
location /api/vigil/discover { set $vigil_upstream http://citadel-vigil:8085; proxy_pass $vigil_upstream/api/discover; }

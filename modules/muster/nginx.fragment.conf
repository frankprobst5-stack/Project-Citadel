# Muster bridge API proxy lanes -- same lazy-DNS-resolution pattern as
# every other module's fragment here (see cockpit/nginx.conf's own
# comment on why: a literal hostname in proxy_pass resolves once at
# config-load time and takes down the WHOLE cockpit if that container
# isn't running yet, not just this route).
location /api/muster/messages { set $muster_upstream http://citadel-muster-bridge:8080; proxy_pass $muster_upstream/api/muster/messages; }
location /api/muster/markers { set $muster_upstream http://citadel-muster-bridge:8080; proxy_pass $muster_upstream/api/muster/markers; }

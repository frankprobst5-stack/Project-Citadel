services:
  # Layer 9.5: Cloud9 -- a real, already-built homeschool/kid dashboard
  # (github.com/frankprobst5-stack/Cloud9), previously a Windows-only
  # desktop app for one specific kid's laptop, now run here so it's
  # reachable from any device on the LAN like everything else in Citadel.
  # Needs a real Dockerfile (not the runtime-pip-install pattern the
  # lightweight Python services above use) mainly for ffmpeg (yt-dlp's
  # video handling) -- it used to also need build-essential+cmake to
  # compile its own private llama-cpp-python + a 1.1GB Qwen model, but
  # that's gone as of 2026-09-14: it now calls Citadel's shared `ollama`
  # (see the `ai` module fragment -- that service carries the
  # "education" profile too specifically so it starts alongside this
  # one) over HTTP instead, so the system only ever runs one inference
  # engine. data/ is volume-mounted real host data (kid-generated
  # journal/planner/scratchpad content), never baked into the image,
  # same reasoning as every other appdata/ real-data volume in this
  # file -- models/ is gone along with the model it used to hold.
  cloud9:
    build: ../../appdata/cloud9
    container_name: citadel-cloud9
    profiles: ["education"]
    ports:
      - "${CLOUD9_PORT}:5057"
    volumes:
      - ../../appdata/cloud9/data:/app/data
      # Real host-launcher socket directory (see host-launcher/
      # cloud9-launcher.py's own module doc for the full reasoning) --
      # lets Cloud9's "Kart Racing"/"Code Lab"/"Globe" buttons ask a
      # narrowly-scoped host-side daemon to launch one of a few
      # pre-approved native apps, without ever giving this container
      # itself a display or filesystem access to the host. Mounting the
      # whole (otherwise-empty) directory rather than the socket file
      # itself is deliberate -- see that same file's SOCKET_DIR comment
      # for why a direct file mount breaks across a daemon restart.
      # CLOUD9_LAUNCHER_RUNTIME_DIR overrides the default in .env for a
      # non-standard UID; XDG_RUNTIME_DIR (read from whatever shell
      # actually runs `docker compose up`) wins if it's set, same
      # `${A:-${B:-default}}` fallback chain OLLAMA_REMOTE_HOST already
      # uses elsewhere in this file.
      - ${XDG_RUNTIME_DIR:-${CLOUD9_LAUNCHER_RUNTIME_DIR:-/run/user/1000}}/cloud9-launcher:/run/cloud9-launcher
    environment:
      # Real `${VAR:-default}` Compose substitution, added 2026-09-16 for
      # remote-Ollama-host support -- see modules/ai/compose.fragment.yml's
      # own comment for the full reasoning (same pattern, same reason).
      - OLLAMA_BASE_URL=http://${OLLAMA_REMOTE_HOST:-citadel-ollama}:11434
      - OLLAMA_MODEL=llama3.2:1b
      - REDIS_URL=redis://citadel-cloud9-redis:6379/0
      # The Learning Journal's real backing store -- Flatnotes
      # (modules/notes/compose.fragment.yml), reused rather than building
      # new storage, per CARD_REDESIGN_PLAN.md's own "don't rebuild"
      # finding. A missing/disabled `notes` profile just means the
      # Journal honestly reports it can't reach the notes service --
      # never a crash, matching every other cross-container call here.
      - FLATNOTES_BASE_URL=http://citadel-flatnotes:8080
      # Real fix for a live-reported vulnerability (2026-09-21) -- see
      # docker-compose.yml's own comment on this variable for the full
      # story. weather.py's alerts proxy is the one real container-to-
      # container caller of vault-api's /api/*, so it needs this token
      # too now that vault-api requires it on every request.
      - VAULT_API_TOKEN=${VAULT_API_TOKEN:-}
    # Real memory cap, raised 2026-09-21 from the original 256m --
    # Real memory cap, raised again 2026-09-23 (512m -> 1024m) after
    # adding the Sounding Lab: MetPy pulls in scipy/pandas/pint on top of
    # xarray/cfgrib for real K-index/Total Totals/Showalter Index physics
    # (sounding.py) -- measured the actual running Flask worker's RSS
    # after one real multi-level profile fetch+compute at ~296MB, before
    # any other feature's own peak (School Library's 21k+ record sync,
    # etc.) potentially overlapping it. 512m (itself already a raise from
    # the original 256m for xarray/cfgrib alone -- see git history) no
    # longer has real safety margin. Learned this same lesson with
    # Kolibri's own mem_limit days earlier -- raising proactively again
    # instead of waiting for a live OOM.
    mem_limit: 1024m
    networks:
      - citadel-net
    # depends_on: [ollama] removed 2026-09-16 -- same real reason as
    # open-webui's (modules/ai/compose.fragment.yml): ollama now lives in
    # its own "ollama-local" profile, and a depends_on crossing an
    # inactive profile is a hard Compose error, verified directly.
    # No depends_on on cloud9-redis either, same reasoning -- interactivity.py
    # already treats Redis as best-effort (a missing/slow-starting Redis
    # never blocks a card), so a hard startup ordering dependency isn't
    # needed here.
    restart: unless-stopped

  # Cross-Subject Interactivity Engine's live event bus (see
  # server/interactivity.py) -- internal only, no host port exposed, no
  # persistence volume: it's a best-effort broadcast layer on top of
  # SQLite's own durable event log, not a source of truth worth
  # surviving a container restart.
  cloud9-redis:
    image: redis:7-alpine
    container_name: citadel-cloud9-redis
    profiles: ["education"]
    mem_limit: 64m
    networks:
      - citadel-net
    restart: unless-stopped

  # Layer 10: The Offline Home Schooling Matrix Hub
  kolibri:
    image: learningequality/kolibri:latest
    container_name: citadel-kolibri
    profiles: ["education"]
    ports:
      - "${KOLIBRI_PORT}:8080"
    volumes:
      - ${KOLIBRI_DATA_PATH}:/kolibri
    # Real memory cap, raised 2026-09-20 from the original 1024m --
    # found live while building Cloud9's School Library view: querying
    # /api/content/contentnode/ with a `kind` filter against a real,
    # large content library (100GB+, several channels) pinned the
    # container at its 1024m ceiling and the request never completed in
    # under 3 minutes. Confirmed the limit itself was the bottleneck,
    # not Kolibri being generically slow -- the exact same query
    # returned in seconds once this was raised. 1024m was sized for
    # "Kolibri is running," not "Kolibri is executing a real filtered
    # query over real content" -- a materially different workload.
    mem_limit: 2048m
    networks:
      - citadel-net
    restart: unless-stopped

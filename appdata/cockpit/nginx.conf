server {
    listen 80;
    server_name localhost;

    # Default 1MB body limit would reject any real PDF/video upload to
    # /api/media/ below before it ever reaches vault-api.
    client_max_body_size 500m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # WayStation reads these tiles cross-origin -- a separate app on its
    # own origin (localhost:1420 in dev, tauri://localhost packaged),
    # unlike Citadel's own map.html which never needed CORS since it's
    # served from this exact same nginx (same-origin request). pmtiles.js
    # depends on reading HTTP Range response metadata, which browsers
    # don't expose to cross-origin JS unless explicitly listed here, even
    # though the request itself is allowed.
    location /tiles/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers 'Content-Range, Content-Length, Accept-Ranges';
    }

    # .mjs isn't in nginx's default mime.types, so it's served as
    # application/octet-stream and browsers refuse to execute it as an ES
    # module. Needed for the vendored MapLibre GL JS bundle (map.html).
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    # Pass Project IBRIS radar tracking data targets smoothly
    location /api/radar {
        proxy_pass http://citadel-vault-brain:5000/api/radar;
    }

    # Trunked-radio scanner and local-weather-capture state -- same
    # daemon-writes-JSON/vault-api-reads-JSON shape as /api/radar above.
    # WayStation (the operator-facing UI for both, see ROADMAP.md) reaches
    # these from its own Rust backend via reqwest, same as every other
    # external integration it has (nws.rs, pota.rs, ...) -- not a browser
    # fetch(), so CORS doesn't apply here the way it does for /tiles/ above.
    location /api/scanner { proxy_pass http://citadel-vault-brain:5000/api/scanner; }
    location /api/scanner/config { proxy_pass http://citadel-vault-brain:5000/api/scanner/config; }
    location /api/weather { proxy_pass http://citadel-vault-brain:5000/api/weather; }

    # Project Vigil Smart Home Automation UI Proxy Lanes
    location /api/grid { proxy_pass http://citadel-vigil:8085/api/grid; }
    location /api/register { proxy_pass http://citadel-vigil:8085/api/register; }
    location /api/toggle { proxy_pass http://citadel-vigil:8085/api/toggle; }
    # Solar/security telemetry and mDNS device discovery -- new routes,
    # 2026-09-13 (ROADMAP.md Phase D unification), same container as the
    # three routes above now that vigil-hub/vigil-power merged into one
    # citadel-vigil service.
    location /api/vigil/state { proxy_pass http://citadel-vigil:8085/api/state; }
    location /api/vigil/update { proxy_pass http://citadel-vigil:8085/api/update; }
    location /api/vigil/discover { proxy_pass http://citadel-vigil:8085/api/discover; }

    

    # Core Vault Storage Data Engines
    # (Notes proxy rules removed — notes.html iframes the standalone
    # flatnotes container directly on its own port; vault-api never had
    # matching /api/get-notes, /api/load-note/, or /api/save-note routes.)
    location /vault-root/ { proxy_pass http://citadel-vault-brain:5000/; proxy_set_header Host $host; }

    # CORRECTED: Unified Secure AI Routing Pipes pointing to the true container network
    location /api/chat { 
        proxy_pass http://citadel-ollama:11434/api/chat; 
        proxy_set_header Host $host; 
    }
    
    location /api/ { 
        proxy_pass http://citadel-ollama:11434; 
        proxy_set_header Host $host; 
    }
    location /api/inventory { proxy_pass http://citadel-vault-brain:5000/api/inventory; }
    location /api/garden { proxy_pass http://citadel-vault-brain:5000/api/garden; }
    location /api/pantry-check { proxy_pass http://citadel-vault-brain:5000/api/pantry-check; }

    # OpenAI-compatible shim for Mealie's Audio Provider (recipe-from-video
    # import), decided 2026-09-12. whisper-server's real /inference route
    # already returns the exact `{"text": "..."}` shape OpenAI's
    # /v1/audio/transcriptions expects, and already tolerates the extra
    # `model`/`language` form fields an OpenAI client sends -- verified
    # live against the real running whisper-server before adding this,
    # not assumed. The only actual mismatch was the URL path, so this is
    # a path rewrite, not a reshaping proxy: Mealie's Audio Provider
    # baseUrl should be http://citadel-cockpit/v1 (this nginx, container
    # port 80 -- not the host-mapped 8085), which combined with an
    # OpenAI client's own "/audio/transcriptions" suffix lands here.
    location /v1/audio/transcriptions {
        proxy_pass http://citadel-whisper:8082/inference;
    }

    # Reference-library uploads (PDFs/videos) -- see /api/media/<kind> and
    # /api/media/<kind>/<category> in media-vault/app.py.
    location /api/media/ {
        proxy_pass http://citadel-vault-brain:5000/api/media/;
        client_max_body_size 500m;
    }
   
    # Central Media Vault Streaming Proxy Tracks
    location /videos { proxy_pass http://citadel-vault-brain:5000/videos; }
    location /mp3 { proxy_pass http://citadel-vault-brain:5000/mp3; }
    location /pdf { proxy_pass http://citadel-vault-brain:5000/pdf; }
    location /files/ { proxy_pass http://citadel-vault-brain:5000/files/; }
}

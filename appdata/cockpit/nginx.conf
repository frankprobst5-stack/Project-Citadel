server {
    listen 80;
    server_name localhost;

    # Default 1MB body limit would reject any real PDF/video upload to
    # /api/media/ below before it ever reaches vault-api.
    client_max_body_size 500m;

    # CRITICAL, found live 2026-09-13: nginx resolves a literal hostname
    # in `proxy_pass` ONCE, at config-load time -- if that container
    # isn't running right then, nginx refuses to start AT ALL, taking
    # down the entire cockpit (every tile, not just the one route),
    # confirmed live when citadel-cockpit crash-looped entirely after
    # stopping the profile-gated citadel-intercept-backend container.
    # This became a real, live-triggerable bug the moment Phase B added
    # profiles that let people run without some containers -- before
    # that, everything nginx proxied to was always running. Fix: this
    # resolver (Docker's own embedded DNS at 127.0.0.11) plus a $variable
    # in `proxy_pass` (not a literal hostname) makes nginx resolve the
    # name LAZILY per-request instead of once at startup -- nginx starts
    # fine regardless of which optional containers are up, and only a
    # request actually hitting a down service gets a 502, not the whole
    # dashboard. Applies to every module's own proxy routes too (see
    # modules-enabled/*.conf, included below) -- any fragment adding a
    # route to a profile-gated container must follow the same pattern.
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # WayStation reads these tiles cross-origin -- a separate app on its
    # own origin (localhost:1420 in dev, tauri://localhost packaged),
    # unlike Citadel's own map.html which never needed CORS since it's
    # served from this exact same nginx (same-origin request). pmtiles.js
    # depends on reading HTTP Range response metadata, which browsers
    # don't expose to cross-origin JS unless explicitly listed here, even
    # though the request itself is allowed.
    location /tiles/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers 'Content-Range, Content-Length, Accept-Ranges';
    }

    # .mjs isn't in nginx's default mime.types, so it's served as
    # application/octet-stream and browsers refuse to execute it as an ES
    # module. Needed for the vendored MapLibre GL JS bundle (map.html).
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    # Core Vault Storage Data Engines
    # (Notes proxy rules removed — notes.html iframes the standalone
    # flatnotes container directly on its own port; vault-api never had
    # matching /api/get-notes, /api/load-note/, or /api/save-note routes.)
    location /vault-root/ { proxy_pass http://citadel-vault-brain:5000/; proxy_set_header Host $host; }

    location /api/inventory { proxy_pass http://citadel-vault-brain:5000/api/inventory; }
    location /api/garden { proxy_pass http://citadel-vault-brain:5000/api/garden; }
    # Backup/restore -- client_max_body_size raised since a restore
    # upload is a real archive of most of appdata/, not a small request.
    location /api/backup/ {
        proxy_pass http://citadel-vault-brain:5000/api/backup/;
        client_max_body_size 2000m;
    }
    location /api/pantry-check { proxy_pass http://citadel-vault-brain:5000/api/pantry-check; }

    # Settings > Modules (list/toggle/install), added 2026-09-14 -- see
    # modules_manager.py. /api/modules/install takes a .zip upload, same
    # reasoning as /api/backup/'s raised body size above.
    location /api/modules { proxy_pass http://citadel-vault-brain:5000/api/modules; }
    location /api/modules/ {
        proxy_pass http://citadel-vault-brain:5000/api/modules/;
        client_max_body_size 200m;
    }

    # Reference-library uploads (PDFs/videos) -- see /api/media/<kind> and
    # /api/media/<kind>/<category> in media-vault/app.py.
    location /api/media/ {
        proxy_pass http://citadel-vault-brain:5000/api/media/;
        client_max_body_size 500m;
    }

    # News Archive & Local Log (ROADMAP.md DISCOVERY item), added
    # 2026-09-16 -- vault-api is core/always-on, not profile-gated, so
    # this uses the same direct proxy_pass style as /api/modules above,
    # not the lazy-DNS pattern this file's own top-of-file comment
    # requires for profile-gated containers like vigil.
    location /api/news/ { proxy_pass http://citadel-vault-brain:5000/api/news/; }

    # Trunked-radio scanner (status, config, profiles, recordings,
    # transcription) -- real, serious gap found 2026-09-24 while building
    # the scanner multi-profile switcher: this route was NEVER proxied
    # here at all, despite the scanner feature's own ROADMAP.md entries
    # (2026-09-05 onward) claiming it was "verified live against the real
    # running Citadel instance" -- those verifications hit vault-api
    # directly, never through this nginx, so the actual path WayStation
    # uses by default (citadel_map_host, port 8085) has been silently
    # broken (a bare 404 from location / above) this entire time. Same
    # bare-plus-trailing-slash pattern as /api/modules above, since
    # vault-api's own scanner routes are a mix of bare (/api/scanner) and
    # deeper paths (/api/scanner/config, /api/scanner/profiles/<id>/activate).
    location /api/scanner { proxy_pass http://citadel-vault-brain:5000/api/scanner; }
    location /api/scanner/ { proxy_pass http://citadel-vault-brain:5000/api/scanner/; }

    # Central Media Vault Streaming Proxy Tracks
    location /videos { proxy_pass http://citadel-vault-brain:5000/videos; }
    location /mp3 { proxy_pass http://citadel-vault-brain:5000/mp3; }
    location /pdf { proxy_pass http://citadel-vault-brain:5000/pdf; }
    location /files/ { proxy_pass http://citadel-vault-brain:5000/files/; }

    # Module system, ROADMAP.md Phase B: every optional module's own
    # proxy routes (Vigil, Off-Grid AI, the hardware bundle, Whisper --
    # see modules/<name>/nginx.fragment.conf) live in their own fragment
    # file, not hand-edited into this one. The cockpit container's
    # startup script (docker-compose.yml) copies exactly the fragments
    # for currently-active profiles into /etc/nginx/modules-enabled/ on
    # every container start, so this include always reflects the real
    # COMPOSE_PROFILES selection -- a module you didn't enable never gets
    # an nginx route at all, not just a route that 502s.
    include /etc/nginx/modules-enabled/*.conf;
}

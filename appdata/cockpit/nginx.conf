server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Pass Project IBRIS radar tracking data targets smoothly
    location /api/radar {
        proxy_pass http://citadel-vault-brain:5000/api/radar;
    }

    # Project Vigil Smart Home Automation UI Proxy Lanes
    location /api/grid { proxy_pass http://citadel-vigil-engine:8085/api/grid; }
    location /api/register { proxy_pass http://citadel-vigil-engine:8085/api/register; }
    location /api/toggle { proxy_pass http://citadel-vigil-engine:8085/api/toggle; }

    

    # Core Vault Storage Data Engines
    # (Notes proxy rules removed — notes.html iframes the standalone
    # flatnotes container directly on its own port; vault-api never had
    # matching /api/get-notes, /api/load-note/, or /api/save-note routes.)
    location /vault-root/ { proxy_pass http://citadel-vault-brain:5000/; proxy_set_header Host $host; }

    # CORRECTED: Unified Secure AI Routing Pipes pointing to the true container network
    location /api/chat { 
        proxy_pass http://citadel-ollama:11434/api/chat; 
        proxy_set_header Host $host; 
    }
    
    location /api/ { 
        proxy_pass http://citadel-ollama:11434; 
        proxy_set_header Host $host; 
    }
    location /api/inventory { proxy_pass http://citadel-vault-brain:5000/api/inventory; }
    location /api/garden { proxy_pass http://citadel-vault-brain:5000/api/garden; }
   
    # Central Media Vault Streaming Proxy Tracks
    location /videos { proxy_pass http://citadel-vault-brain:5000/videos; }
    location /mp3 { proxy_pass http://citadel-vault-brain:5000/mp3; }
    location /pdf { proxy_pass http://citadel-vault-brain:5000/pdf; }
    location /files/ { proxy_pass http://citadel-vault-brain:5000/files/; }
}

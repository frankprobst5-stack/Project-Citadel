<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITADEL // EDUCATION HUB</title>
    <style>
        body { font-family: 'Ubuntu', sans-serif; background: #11120e; color: #e6e8e3; padding: 25px; margin: 0; box-sizing: border-box; }
        .container { max-width: 1650px; margin: 0 auto; }
        
        .header-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #5a4b21; padding-bottom: 15px; }
        h1 { color: #b3a27a; margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .action-btn { background: #2d281c; border: 1px solid #5c4e31; color: #e6e8e3; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .action-btn:hover { background: #3d3324; border-color: #b3a27a; }

        .school-panel { background: #1c1f16; border: 1px solid #3a4031; border-radius: 6px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .panel-header { font-family: monospace; font-size: 0.85rem; color: #a4b38a; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px solid #3a4031; padding-bottom: 6px; }
        
        iframe { width: 100%; height: 75vh; border: 1px solid #3a4031; border-radius: 4px; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- COCKPIT NAVIGATION HEADER -->
        <div class="header-block">
            <h1>🎓 PROJECT CITADEL // HOMESTEAD EDUCATION HUB</h1>
            <button class="action-btn" onclick="window.location.href='index.html'">⬅ COCKPIT MATRIX</button>
        </div>

        <!-- EMBEDDED LOCAL KOLIBRI APPLICATION RUNTIME -->
        <div class="school-panel">
            <div class="panel-header">📚 KOLIBRI OFFLINE LEARNING ARCHIVE SECTOR</div>
            <!-- Launches your containerized learning platform through the reverse proxy lane -->
            <iframe src="http://localhost:8081" style="width: 100%; height: 78vh; border: 1px solid #3a4031; border-radius: 4px; background: #fff;" allowfullscreen></iframe>

        </div>
    </div>
</body>
</html>

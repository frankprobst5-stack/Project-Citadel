<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITADEL // EDUCATION HUB</title>
    <link rel="icon" type="image/svg+xml" href="citadel-favicon.svg">
    <style>
        :root {
            /* Citadel Ecosystem brand palette, adopted 2026-09-18 -- see index.html */
            --bg: #05090d; --panel: #071a2c; --panel-alt: #0a2038; --border: #2a4a66; --border-dim: #16283a;
            --text: #e7f1f8; --text-dim: #aebbc7; --text-faint: #71899d;
            --accent: #008dff; --accent-bright: #28c8ff; --amber: #ffb000; --green: #59d67c; --red: #e05252;
        }
        body { font-family: 'Ubuntu', sans-serif; background: var(--bg); color: var(--text); padding: 25px; margin: 0; box-sizing: border-box; }
        .container { max-width: 1650px; margin: 0 auto; }
        
        .header-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        h1 { color: var(--accent); margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .action-btn { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .action-btn:hover { background: var(--panel); border-color: var(--accent); }

        .school-panel { background: var(--panel); border-radius: 6px; padding: 20px; box-shadow: 0 0 0 1px var(--accent-bright), 0 0 0 3px var(--border), 0 4px 15px rgba(0,0,0,0.5); }
        .panel-header { font-family: monospace; font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        
        iframe { width: 100%; height: 75vh; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- COCKPIT NAVIGATION HEADER -->
        <div class="header-block">
            <h1>🎓 PROJECT CITADEL // HOMESTEAD EDUCATION HUB</h1>
            <button class="action-btn" onclick="window.location.href='index.html'">⬅ COCKPIT MATRIX</button>
        </div>

        <!-- EMBEDDED LOCAL KOLIBRI APPLICATION RUNTIME -->
        <div class="school-panel">
            <div class="panel-header">📚 KOLIBRI OFFLINE LEARNING ARCHIVE SECTOR</div>
            <!-- Dynamically embeds Kolibri on the current host -- window.location.hostname,
                 not a hardcoded "localhost", so this loads correctly from other devices on
                 the LAN too (a phone/tablet, not just the Citadel host itself). -->
            <script>
                document.write('<iframe src="http://' + window.location.hostname + ':8081" style="width: 100%; height: 78vh; border: 1px solid var(--border); border-radius: 4px; background: #fff;" allowfullscreen></iframe>');
            </script>

        </div>
    </div>
</body>
</html>

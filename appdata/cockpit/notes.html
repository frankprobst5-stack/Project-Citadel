<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITADEL // OPERATIONAL LOGS</title>
    <link rel="icon" type="image/svg+xml" href="citadel-favicon.svg">
    <style>
        :root {
            /* Citadel Ecosystem brand palette, adopted 2026-09-18 -- see index.html */
            --bg: #05090d; --panel: #071a2c; --panel-alt: #0a2038; --border: #2a4a66; --border-dim: #16283a;
            --text: #e7f1f8; --text-dim: #aebbc7; --text-faint: #71899d;
            --accent: #008dff; --accent-bright: #28c8ff; --amber: #ffb000; --green: #59d67c; --red: #e05252;
        }
        body { font-family: 'Ubuntu', sans-serif; background: var(--bg); color: var(--text); padding: 25px; margin: 0; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1600px; margin: 0 auto; width: 100%; flex-grow: 1; display: flex; flex-direction: column; }
        
        .header-block { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; flex-shrink: 0; }
        h1 { color: var(--accent); margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .action-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .action-btn:hover { background: var(--panel-alt); border-color: var(--accent); }

        .status-bar { font-family: monospace; font-size: 0.8rem; color: var(--text-faint); margin-top: -10px; margin-bottom: 15px; text-transform: uppercase; flex-shrink: 0; }
        
        .notes-frame-container { flex-grow: 1; background: var(--panel); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--accent-bright), 0 0 0 3px var(--border), 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 10px; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER ROW -->
        <div class="header-block">
            <h1>📝 PROJECT CITADEL // SECURE OPERATIONS LOGS</h1>
            <button class="action-btn" onclick="window.location.href='index.html'">⬅ COCKPIT MATRIX</button>
        </div>
        
        <div class="status-bar">FLAT-TEXT DECK // STORAGE: ./APPDATA/FLATNOTES // LOCAL_ONLY</div>

        <!-- EMBEDDED APPLICATION FRAME -->
        <div class="notes-frame-container">
            <script>
                // Dynamically embeds the FlatNotes engine running on local proxy port 8098
                document.write('<iframe src="http://' + window.location.hostname + ':8098"></iframe>');
            </script>
        </div>
    </div>
</body>
</html>

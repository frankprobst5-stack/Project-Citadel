<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Vault - Operational Log</title>
    <style>
        body { font-family: 'Ubuntu', sans-serif; background: #1c1e17; color: #e6e8e3; padding: 40px; margin: 0; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4b533f; padding-bottom: 15px; margin-bottom: 20px; flex-shrink: 0; }
        h1 { color: #87986a; margin: 0; font-size: 2rem; }
        .back-btn { background: #2b3025; color: #a4b38a; text-decoration: none; padding: 10px 20px; border-radius: 6px; border: 1px solid #3a4031; font-weight: bold; transition: all 0.2s; }
        .back-btn:hover { background: #353b2e; border-color: #87986a; }
        
        .workspace { flex-grow: 1; display: flex; gap: 25px; overflow: hidden; }
        
        /* Left Sidebar File List */
        .sidebar { width: 300px; background: #23271e; border: 1px solid #3a4031; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .sidebar h2 { color: #a4b38a; margin-top: 0; font-size: 1.1rem; text-transform: uppercase; border-bottom: 1px solid #3a4031; padding-bottom: 10px; letter-spacing: 0.5px; }
        .note-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .note-link { background: #1c1e17; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; border-left: 4px solid #708090; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .note-link:hover { background: #2b3025; border-left-color: #87986a; transform: translateX(2px); }
        .new-btn { background: #4b533f; color: #e6e8e3; border: 1px solid #87986a; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .new-btn:hover { background: #5c664e; }
        
        /* Right Editor Working View */
        .editor-container { flex-grow: 1; background: #23271e; border: 1px solid #3a4031; border-radius: 8px; padding: 25px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .input-title { width: 100%; padding: 12px; background: #282c22; border: 1px solid #4b533f; border-radius: 6px; color: #e6e8e3; font-size: 1.1rem; font-weight: bold; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        .input-title:focus { border-color: #87986a; }
        textarea { flex-grow: 1; width: 100%; padding: 20px; background: #1c1e17; border: 1px solid #3a4031; border-radius: 6px; color: #d0d6c9; font-size: 1.05rem; font-family: monospace; resize: none; box-sizing: border-box; outline: none; line-height: 1.6; }
        textarea:focus { border-color: #4b533f; }
        .save-btn { background: #2b3025; color: #a4b38a; border: 1px solid #3a4031; padding: 12px 30px; border-radius: 6px; font-weight: bold; cursor: pointer; align-self: flex-end; margin-top: 15px; transition: 0.2s; }
        .save-btn:hover { background: #353b2e; border-color: #87986a; }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>📝 SECURE OPERATIONS LOG (OFFLINE WORKSTATION)</h1>
        <a href="/" class="back-btn">⬅ Back to Hub</a>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <h2>📜 Saved Logs</h2>
            <div class="note-list" id="noteList"></div>
            <button class="new-btn" onclick="createNewNote()">+ New Log File</button>
        </div>
        
        <div class="editor-container">
            <input type="text" id="noteTitle" class="input-title" placeholder="Log Title (e.g., Ranch Inventory June 19)">
            <textarea id="noteContent" placeholder="Type your secure notes here... Everything saves 100% locally to your hard drive folder drawer."></textarea>
            <button class="save-btn" onclick="saveNote()">💾 Save Log Document</button>
        </div>
    </div>

    <script>
        let activeFile = '';

        async function loadNotesList() {
            const res = await fetch('/api/get-notes');
            const files = await res.json();
            const listContainer = document.getElementById('noteList');
            listContainer.innerHTML = '';
            files.forEach(file => {
                const cleanName = file.replace('.txt', '');
                listContainer.innerHTML += `<div class="note-link" onclick="loadNote('${file}')">📄 ${cleanName}</div>`;
            });
        }

        async function loadNote(filename) {
            const res = await fetch(`/api/load-note/${filename}`);
            const data = await res.json();
            activeFile = filename;
            document.getElementById('noteTitle').value = filename.replace('.txt', '');
            document.getElementById('noteContent').value = data.content;
        }

        function createNewNote() {
            activeFile = '';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteTitle').focus();
        }

        async function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value;
            if(!title) { alert('Please enter a title for your log.'); return; }
            
            const filename = title.endsWith('.txt') ? title : title + '.txt';
            await fetch('/api/save-note', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename, content })
            });
            activeFile = filename;
            loadNotesList();
            alert('Log saved successfully to disk folder!');
        }

        // Initialize lists immediately
        loadNotesList();
    </script>
</body>
</html>

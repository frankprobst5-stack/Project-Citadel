<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Vault - Kiwix Wiki Archive</title>
    <style>
        body { font-family: 'Ubuntu', sans-serif; background: #1c1e17; color: #e6e8e3; padding: 40px; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4b533f; padding-bottom: 15px; margin-bottom: 20px; flex-shrink: 0; }
        h1 { color: #87986a; margin: 0; font-size: 2rem; }
        .back-btn { background: #2b3025; color: #a4b38a; text-decoration: none; padding: 10px 20px; border-radius: 6px; border: 1px solid #3a4031; font-weight: bold; transition: all 0.2s; }
        .back-btn:hover { background: #353b2e; border-color: #87986a; }
        
        /* Full Frame Window Box for Kiwix Client */
        .frame-wrapper { flex-grow: 1; background: #23271e; border-radius: 8px; border: 1px solid #3a4031; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>🗟 OFFLINE KNOWLEDGE INTEGRATION (KIWIX)</h1>
        <a href="/" class="back-btn">⬅ Back to Hub</a>
    </div>

    <!-- This iframe holds the entire Kiwix internal browser player directly on screen -->
    <div class="frame-wrapper">
        <iframe src="http://127.0.0.1:8080" title="Kiwix Server"></iframe>
    </div>
</body>
</html>

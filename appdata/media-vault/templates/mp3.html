<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Vault - Audio Library</title>
    <style>
        /* Citadel Ecosystem brand palette, adopted 2026-09-18 -- missed in
           that pass since this is a vault-api Flask template, not a
           static cockpit/*.html file. Same real vars as index.html. */
        :root {
            --bg: #05090d; --panel: #071a2c; --panel-alt: #0a2038; --border: #2a4a66; --border-dim: #16283a;
            --text: #e7f1f8; --text-dim: #aebbc7; --text-faint: #71899d;
            --accent: #008dff; --accent-bright: #28c8ff;
        }
        body { font-family: 'Ubuntu', sans-serif; background: var(--bg); color: var(--text); padding: 40px 40px 120px 40px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 30px; }
        h1 { color: var(--accent); margin: 0; font-size: 2rem; }
        .back-btn { background: var(--panel-alt); color: var(--accent-bright); text-decoration: none; padding: 10px 20px; border-radius: 6px; border: 1px solid var(--border-dim); font-weight: bold; transition: all 0.2s; }
        .back-btn:hover { background: var(--panel-alt); border-color: var(--accent); }
        #searchBar { width: 100%; padding: 15px 20px; background: var(--panel-alt); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1.1rem; margin-bottom: 30px; box-sizing: border-box; outline: none; }
        #searchBar:focus { border-color: var(--accent); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .card { background: var(--panel); padding: 25px; border-radius: 8px; border: 1px solid var(--border-dim); box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-height: 400px; overflow-y: auto; }
        h2 { color: var(--accent-bright); margin-top: 0; border-bottom: 1px solid var(--border-dim); padding-bottom: 10px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card::-webkit-scrollbar { width: 6px; }
        .card::-webkit-scrollbar-track { background: var(--bg); border-radius: 4px; }
        .card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .card::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        .file-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 12px 15px; margin: 10px 0; border-radius: 6px; border-left: 4px solid var(--border); text-decoration: none; cursor: pointer; transition: all 0.2s; }
        .file-item:hover { background: var(--panel-alt); border-left-color: var(--accent); transform: translateX(3px); }
        .file-name { color: var(--text-dim); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        .hidden { display: none !important; }
        .empty-text { color: var(--text-faint); font-size: 0.9rem; font-style: italic; padding: 10px; }

        /* Fixed Footer Spotify-Style Player Dock */
        .footer-player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 2px solid var(--border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 25px rgba(0,0,0,0.6); z-index: 1000; }
        .track-info { min-width: 250px; color: var(--accent-bright); font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        audio { width: 50%; max-width: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>🎵 AUDIO VAULT</h1>
            <a href="/" class="back-btn">⬅ Back to Hub</a>
        </div>
        <input type="text" id="searchBar" placeholder="🔍 Type to search playlists or logs instantly..." onkeyup="filterFiles()">
        
        <div class="grid">
            {% for category, files in categories.items() %}
            <div class="card">
                <h2>🎶 {{ category }}</h2>
                <div class="box-content">
                    {% if files %}
                        {% for file in files %}
                        <div onclick="playAudio('/files/mp3/{{ category }}/{{ file }}', '{{ file }}')" class="file-item">
                            <span class="file-name">🎵 {{ file }}</span>
                        </div>
                        {% endfor %}
                    {% else %}
                        <div class="empty-text">Empty Playlist Folder</div>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Fixed Audio Player Bar -->
    <div class="footer-player">
        <div class="track-info" id="audioTitle">No Track Playing</div>
        <audio id="mainAudioPlayer" controls></audio>
        <div style="min-width: 250px;"></div> <!-- Spacer balancing layout -->
    </div>

    <script>
        function playAudio(fileUrl, fileName) {
            const player = document.getElementById('mainAudioPlayer');
            const title = document.getElementById('audioTitle');
            player.src = fileUrl;
            title.textContent = "🎵 Playing: " + fileName;
            player.play();
        }

        function filterFiles() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.file-item').forEach(item => {
                item.textContent.toLowerCase().includes(query) ? item.classList.remove('hidden') : item.classList.add('hidden');
            });
            document.querySelectorAll('.card').forEach(card => {
                const totalItems = card.querySelectorAll('.file-item').length;
                const hiddenItems = card.querySelectorAll('.file-item.hidden').length;
                if (totalItems > 0 && totalItems === hiddenItems && query !== "") card.classList.add('hidden');
                else card.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Vault - Tactical AI</title>
    <style>
        body { font-family: 'Ubuntu', sans-serif; background: #1c1e17; color: #e6e8e3; padding: 40px; margin: 0; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4b533f; padding-bottom: 15px; margin-bottom: 20px; flex-shrink: 0; }
        h1 { color: #87986a; margin: 0; font-size: 2rem; }
        .back-btn { background: #2b3025; color: #a4b38a; text-decoration: none; padding: 10px 20px; border-radius: 6px; border: 1px solid #3a4031; font-weight: bold; transition: all 0.2s; }
        .back-btn:hover { background: #353b2e; border-color: #87986a; }
        
        .chat-container { flex-grow: 1; background: #23271e; border: 1px solid #3a4031; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { padding: 12px 16px; border-radius: 6px; max-width: 80%; line-height: 1.5; font-size: 1rem; }
        .user-msg { background: #4b533f; color: #e6e8e3; align-self: flex-end; border-left: 4px solid #87986a; }
        .ai-msg { background: #1c1e17; color: #d0d6c9; align-self: flex-start; border-left: 4px solid #708090; }
        
        .input-row { display: flex; padding: 15px; background: #1c1e17; border-top: 1px solid #3a4031; gap: 15px; }
        input { flex-grow: 1; padding: 15px; background: #282c22; border: 1px solid #4b533f; border-radius: 6px; color: #e6e8e3; font-size: 1rem; outline: none; }
        input:focus { border-color: #87986a; }
        button { background: #2b3025; color: #a4b38a; border: 1px solid #3a4031; padding: 0 25px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #353b2e; border-color: #87986a; }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>🤖 TACTICAL INTELLIGENCE CORE (OFFLINE AI)</h1>
        <a href="/" class="back-btn">⬅ Back to Hub</a>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">System online. Secure Local core isolated. How can I assist with processing operations today?</div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Ask the local AI core a question..." onkeypress="handleKey(event)">
            <button onclick="sendPrompt()">Send</button>
        </div>
    </div>

    <script>
        function handleKey(e) { if(e.key === 'Enter') sendPrompt(); }
        async function sendPrompt() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const prompt = input.value.trim();
            if(!prompt) return;

            // Render User Chat Bubble
            chatBox.innerHTML += `<div class="message user-msg">${prompt}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Create blank AI chat bubble for live streaming words
            const aiId = 'ai-' + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${aiId}">...</div>`;
            const aiBubble = document.getElementById(aiId);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Post request to our streaming proxy endpoint
                const response = await fetch('/api/chat-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                aiBubble.innerText = ''; // Clear dots

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    aiBubble.innerText += decoder.decode(value, { stream: true });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                aiBubble.innerText = "Error communicating with the local streaming engine.";
            }
        }
    </script>
</body>
</html>

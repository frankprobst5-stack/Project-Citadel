<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent Tools - Cloud9</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/areas.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/parent-tools.css') }}">
</head>
<body>
  <header class="topbar area-topbar">
    <div class="brand">
      <a class="area-back" href="/" aria-label="Back to Cloud9">← Cloud9</a>
    </div>
    <div class="area-heading">
      <span class="area-heading-icon">🗓️</span>
      <span class="area-heading-title">Parent Tools</span>
    </div>
    <div class="area-heading-tagline">Lay out the real weekly schedule -- My Day shows it live.</div>
  </header>

  <main class="area-main pt-main">
    <div class="pt-week" id="pt-week"></div>
  </main>

  <template id="pt-day-template">
    <div class="pt-day">
      <div class="pt-day-header">
        <span class="pt-day-name"></span>
        <span class="pt-day-total"></span>
      </div>
      <div class="pt-blocks"></div>
      <form class="pt-add-form">
        <input type="text" class="pt-add-title" placeholder="Block title (e.g. Math Lab)" required>
        <select class="pt-add-subject">
          <option value="math">Math</option>
          <option value="reading">Reading</option>
          <option value="science">Science</option>
          <option value="history">History</option>
          <option value="tech">Tech &amp; Engineering</option>
          <option value="journal">Journal</option>
          <option value="break">Break</option>
          <option value="free">Free Time</option>
          <option value="general">General</option>
        </select>
        <input type="text" class="pt-add-link" placeholder="Cloud9 link (optional, e.g. /math-lab)">
        <input type="number" class="pt-add-duration" placeholder="Minutes" value="30" min="5" max="180">
        <input type="text" class="pt-add-desc" placeholder="Description (optional)">
        <button type="submit">+ Add Block</button>
      </form>
    </div>
  </template>

  <div class="pt-block-template" hidden>
    <div class="pt-block">
      <span class="pt-block-subject"></span>
      <span class="pt-block-title"></span>
      <span class="pt-block-duration"></span>
      <button type="button" class="pt-block-remove">✕</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/parent-tools.js') }}"></script>
</body>
</html>

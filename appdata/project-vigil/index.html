<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PROJECT VIGIL</title>
    <style>
        body { background: #080a06; color: #a4b28d; font-family: monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background: #10140e; border: 1px solid #38402f; padding: 20px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between; }
        h1 { color: #d1d5cb; border-bottom: 2px solid #38402f; padding-bottom: 10px; }
        h2 { color: #ffb000; margin-top: 0; font-size: 16px; }
        .btn { background: #151c12; border: 1px solid #455239; color: #a4b28d; padding: 8px; width: 100%; cursor: pointer; font-family: monospace; font-weight: bold; margin-top: 10px; text-transform: uppercase; }
        .btn:hover { color: #00ff66; border-color: #00ff66; }
        .cam-feed { width: 100%; height: 180px; background: #000; border: 1px solid #38402f; margin-top: 10px; border-radius: 2px; object-fit: cover; }
    </style>
</head>
<body>
    <h1>🛰️ PROJECT VIGIL // COMMAND MATRIX <button class="btn" style="width: auto; margin: 0; padding: 8px 16px;" onclick="window.location.href='/index.html'">⬅ COCKPIT MATRIX</button></h1>

    <div id="status" style="color:#00ff66;font-weight:bold;margin-bottom:20px;">INITIALIZING...</div>

    <!-- Solar/security telemetry -- real data from /api/vigil/state, added
         2026-09-13. Previously ran as its own container with no dashboard
         panel anywhere (ROADMAP.md Phase C/D). -->
    <div class="card" style="margin-bottom: 20px;">
        <h2>⚡ Power & Security Telemetry</h2>
        <div id="telemetry-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; font-size: 13px;">Loading...</div>
        <div style="font-size:11px; color:#556346; margin-top:10px;">Last update: <span id="telemetry-updated">--</span></div>
    </div>

    <!-- Local network device discovery (mDNS) -- real, added 2026-09-13.
         Honestly reports whatever it actually finds on your LAN; an empty
         result on a network with no Tasmota/Shelly/ESPHome hardware yet
         is correct, not broken. -->
    <div class="card" style="margin-bottom: 20px;">
        <h2>🔍 Discover Local Devices</h2>
        <p style="font-size:12px; color:#8a9478; margin-top:0;">Scans your LAN for Tasmota, Shelly, and ESPHome devices via mDNS (~4 seconds). Register anything found below to bring it under manual/automated control.</p>
        <button class="btn" style="width:auto; padding: 8px 20px;" onclick="runDiscovery()">Scan Now</button>
        <div id="discover-results" style="margin-top:12px; font-size:13px;"></div>
    </div>

    <div class="grid" id="container"></div>

</div>

    <script>
        async function updateHUD() {
            try {
                const r = await fetch("/api/grid?t=" + Date.now());
                if (!r.ok) throw new Error("Server disconnected");
                const d = await r.json();
                let h = "";
                
                for (const id in d) {
                    const dev = d[id];
                    let cameraElement = "";
                    
                    if (dev.stream_url && dev.stream_url.trim() !== "") {
                        cameraElement = `<img class="cam-feed" src="${dev.stream_url}" alt="LIVE CAMERA INTERCEPT" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\' width=\'100\' height=\'50\' viewBox=\'0 0 100 50\'><rect width=\'100\' height=\'50\' fill=\'%23050704\'/><text x=\'50\' y=\'28\' font-family=\'monospace\' font-size=\'6\' fill=\'%23ff3333\' text-anchor=\'middle\'>[ FEED OFFLINE ]</text></svg>'">`;
                    }
                    
                    h += `
                    <div class="card">
                        <div>
                            <h2>🎯 NODE: ${id.toUpperCase()}</h2>
                            <div style="margin-bottom:4px;">PROFILE: <span style="color:#ffb000;">${(dev.type || "GENERIC_RELAY").toUpperCase()}</span></div>
                            <div style="margin-bottom:4px;">IP ROUTE: <span style="font-family:monospace; color:#87986a;">${dev.ip || "0.0.0.0"}</span></div>
                            <div style="margin-bottom:4px;">STATUS: <span style="color:${dev.state === 'ON' ? '#00ff66' : '#ff3333'}; font-weight:bold;">${dev.state || "OFF"}</span></div>
                            <div style="margin-bottom:4px; font-size:11px; color:#556346;">LAST CAPTURE: ${dev.last_seen || "NEVER"}</div>
                            ${cameraElement}
                        </div>
                        <button class="btn" onclick="toggleRelay('${id}')">TOGGLE OVERRIDE RELAY</button>
                    </div>`;
                }
                
                document.getElementById("container").innerHTML = h || `<div class="scanning-text">SCANNING AIRWAVES... NO OPEN AUTOMATION HARDWARE CAPTURED YET...</div>`;
                document.getElementById("status").innerText = "Sovereign Base Controller Online // Monitoring Local Infrastructure";
                document.getElementById("status").style.color = "#00ff66";
            } catch (e) {
                document.getElementById("status").innerText = "METRIC DROP (Project VIGIL Network Engine Interrupted)";
                document.getElementById("status").style.color = "#ff3333";
            }
        }

        async function toggleRelay(id) {
            try {
                await fetch("/api/toggle", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ device_id: id })
                });
                setTimeout(updateHUD, 150);
            } catch (err) {
                console.error("Outbound override directive failed:", err);
            }
        }

        // ---- Power & security telemetry ----
        const TELEMETRY_LABELS = {
            solar_battery_soc: "Battery SOC",
            solar_input_watts: "Solar Input",
            critical_power_bus: "Critical Bus",
            secondary_power_bus: "Secondary Bus",
            perimeter_tripline: "Tripline",
            smart_plug_fridge: "Fridge Plug",
            perimeter_lights: "Perimeter Lights",
        };
        async function updateTelemetry() {
            try {
                const r = await fetch("/api/vigil/state?t=" + Date.now());
                if (!r.ok) throw new Error("unreachable");
                const d = await r.json();
                const grid = document.getElementById("telemetry-grid");
                grid.innerHTML = Object.entries(TELEMETRY_LABELS).map(([key, label]) => {
                    const val = d[key];
                    const isOnOff = val === "ON" || val === "OFF" || val === "SECURE" || val === "TRIPPED";
                    const color = (val === "ON" || val === "SECURE") ? "#00ff66" : (val === "TRIPPED" ? "#ff3333" : "#a4b28d");
                    return `<div><div style="color:#556346;">${label}</div><div style="color:${isOnOff ? color : '#ffb000'}; font-weight:bold;">${val}${key === 'solar_battery_soc' ? '%' : key === 'solar_input_watts' ? 'W' : ''}</div></div>`;
                }).join('');
                document.getElementById("telemetry-updated").textContent = d.last_update || "--";
            } catch (e) {
                document.getElementById("telemetry-grid").innerHTML = '<div style="color:#ff3333;">Telemetry unreachable</div>';
            }
        }

        // ---- Local device discovery ----
        async function runDiscovery() {
            const box = document.getElementById("discover-results");
            box.innerHTML = "Scanning local network (~4 seconds)...";
            try {
                const r = await fetch("/api/vigil/discover");
                const d = await r.json();
                if (d.status !== "success") {
                    box.innerHTML = `<span style="color:#ff3333;">${d.detail || "Discovery failed"}</span>`;
                    return;
                }
                if (!d.devices.length) {
                    box.innerHTML = '<span style="color:#8a9478;">No Tasmota/Shelly/ESPHome devices found on this network.</span>';
                    return;
                }
                box.innerHTML = d.devices.map(dev => `
                    <div style="background:#151c12; padding:8px 12px; margin-bottom:6px; border-radius:3px;">
                        <b>${dev.name}</b> -- ${dev.likely_protocol} at ${dev.ip || '?'}:${dev.port || '?'}
                    </div>
                `).join('');
            } catch (e) {
                box.innerHTML = '<span style="color:#ff3333;">Discovery request failed -- see console.</span>';
                console.error(e);
            }
        }

        setInterval(updateHUD, 2000);
        setInterval(updateTelemetry, 5000);
        window.onload = () => { updateHUD(); updateTelemetry(); };
    </script>
</body>
</html>
